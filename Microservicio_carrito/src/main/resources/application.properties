spring.application.name=carrito
server.port=8084

# Perfil de base de datos: oracle (activo), h2 (archivo local) o mysql.
# Para cambiar sin editar el archivo:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.profiles.active=oracle

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT (el MISMO secreto debe usarse en login, productos y carrito) ---
app.jwt.secret=${JWT_SECRET:sv-clave-demo-solo-desarrollo-cambiar-en-produccion-123456}
app.jwt.issuer=sonidos-vergatarios
app.jwt.access-minutes=15

# Comunicación con el microservicio de productos (llamadas internas, no pasan por el Gateway).
app.productos-url=${PRODUCTOS_URL:http://localhost:8083}
# Debe coincidir con la clave de productos.
app.internal-key=${INTERNAL_KEY:clave-interna-demo-cambiar-en-produccion}

# Swagger / OpenAPI
app.public-url=${PUBLIC_URL:http://localhost:8081}
springdoc.swagger-ui.path=/swagger-ui.html

# Feign: tiempos máximos de espera (ms)
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
